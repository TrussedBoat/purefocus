<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocked by PureFocus</title>
  <style>
    :root { --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      padding: 0 16px;
      text-align: center;
      font: 15px/1.5 system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Blocked by PureFocus</h1>
  <p>You can change this from the PureFocus icon in the toolbar.</p>
</body>
</html>
